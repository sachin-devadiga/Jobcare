name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/flutter_build.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_BACKEND: ${{ github.repository }}/backend
  DOCKER_IMAGE_NGINX: ${{ github.repository }}/nginx
  BUILD_TAG: ${{ github.sha }}

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NGINX }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/nginx
          file: ./deploy/nginx/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NGINX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tag
        id: tag
        run: echo "tag=$(echo ${{ github.sha }})" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} -p ${{ secrets.DEPLOY_PORT || 22 }} << 'DEPLOY_EOF'
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest images
            docker compose pull

            # Backup database
            docker compose exec -T postgres pg_dump -U $DB_NAME $DB_NAME > backup_$(date +%Y%m%d_%H%M%S).sql

            # Apply migrations
            docker compose run --rm backend python manage.py migrate --noinput

            # Collect static files
            docker compose run --rm backend python manage.py collectstatic --noinput --clear

            # Restart services
            docker compose up -d --force-recreate --remove-orphans

            # Clean up old images and volumes
            docker image prune -af --filter "until=24h"
            docker system prune -f --volumes

            echo "Deployment completed successfully"
          DEPLOY_EOF

      - name: Health Check
        run: |
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN }}/api/health/ || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check passed (status: $status)"
              exit 0
            fi
            echo "Attempt $i: Health check failed (status: $status), retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Deployment failed for ${{ github.repository }} on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.triggering_actor }}. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
