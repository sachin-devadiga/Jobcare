name: Run Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: test-secret-key-not-used-in-production
  DEBUG: "0"
  DB_NAME: jobcare_test
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: 5432
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/0

jobs:
  django-tests:
    name: Django Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: jobcare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev gettext

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-asyncio flake8 black isort

      - name: Run flake8 linting
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: Run black formatting check
        working-directory: ./backend
        run: black --check --diff . || echo "Black check failed - run 'black .' to fix"

      - name: Run isort check
        working-directory: ./backend
        run: isort --check-only --diff . || echo "isort check failed - run 'isort .' to fix"

      - name: Run Django tests with coverage
        working-directory: ./backend
        run: |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput --clear 2>/dev/null || true
          pytest --cov=. --cov-report=xml --cov-report=term-missing \
            --junitxml=test-results/junit.xml \
            -v --reuse-db --create-db

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-test-results
          path: backend/test-results/
          retention-days: 7

  flutter-tests:
    name: Flutter Tests
    runs-on: ubuntu-latest
    if: false  # Disabled until Flutter SDK is added

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: ./frontend_mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: ./frontend_mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: ./frontend_mobile
        run: flutter test --coverage

      - name: Upload Flutter test coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend_mobile/coverage/
          retention-days: 7
