name: jobcare_voice
description: AI-powered voice-first job platform for blue-collar workers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  json_annotation: ^4.8.1
  cached_network_image: ^3.3.1
  google_maps_flutter: ^2.5.3
  google_maps_place_picker_mb: ^3.0.0
  image_picker: ^1.0.7
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_local_notifications: ^17.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  connectivity_plus: ^6.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  share_plus: ^10.0.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  intl: ^0.19.0
  google_sign_in: ^6.1.6
  flutter_animate: ^4.3.0
  percent_indicator: ^4.2.3
  equatable: ^2.0.5
  url_launcher: ^6.2.2
  fluttertoast: ^8.2.4
  permission_handler: ^11.3.0
  audioplayers: ^6.0.0
  record: ^7.1.1
  path_provider: ^2.1.2
  file_picker: ^11.0.0
  image_cropper: ^12.0.0
  local_auth: ^2.1.7
  web_socket_channel: ^2.4.0
  flutter_cache_manager: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  synchronized: ^3.1.0
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10
  mockito: ^5.4.4
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color: "#1565C0"

flutter_native_splash:
  color: "#1565C0"
  background_image: "assets/images/splash_bg.png"
  image: "assets/images/splash_logo.png"
  branding: "assets/images/splash_branding.png"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_splash_screen_size: 128
