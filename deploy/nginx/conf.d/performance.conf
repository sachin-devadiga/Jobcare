# JobCare Voice - Nginx Performance Configuration

# Gzip Compression
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml
    font/woff
    font/woff2;

# Browser Caching for Static Assets
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    log_not_found off;
}

location ~* \.(pdf|doc|docx|xls|xlsx)$ {
    expires 30d;
    add_header Cache-Control "public";
}

location ~* \.(json)$ {
    expires 1h;
    add_header Cache-Control "public";
}

# API Proxy with Performance Tuning
location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Client Body Size for Uploads
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Response Compression
    gzip on;
    gzip_proxied any;
}

# WebSocket Support
location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Static Files
location /static/ {
    alias /app/backend/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /media/ {
    alias /app/backend/media/;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=websocket_limit:10m rate=100r/s;

# Rate Limiting
location /api/v1/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
}

location /api/v1/jobs/ {
    limit_req zone=search_limit burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
}

location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
}

# Connection Limiting per IP
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
limit_conn addr_limit 100;

# Request Queuing
location @queue {
    return 503;
}

# Keepalive Connections
upstream backend {
    server backend:8000;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# HTTP/2 Support
listen 443 ssl http2;
listen [::]:443 ssl http2;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:;" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Logging
access_log /var/log/nginx/access.log combined buffer=64k flush=1m;
error_log /var/log/nginx/error.log warn;
