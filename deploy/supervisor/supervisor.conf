; Supervisor configuration for JobCare Voice production process management
; Install: sudo apt-get install supervisor
; Copy: sudo cp supervisor.conf /etc/supervisor/conf.d/jobcare.conf
; Reload: sudo supervisorctl reread && sudo supervisorctl update
; Status: sudo supervisorctl status

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=root:root

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200
user=root
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files=/etc/supervisor/conf.d/*.conf

; ============================================
; JobCare Voice Programs
; ============================================

[program:jobcare_backend]
command=/usr/local/bin/gunicorn config.wsgi:application
    --bind 0.0.0.0:8000
    --workers 6
    --worker-class sync
    --timeout 120
    --graceful-timeout 60
    --max-requests 2000
    --max-requests-jitter 500
    --access-logfile /var/log/jobcare/gunicorn_access.log
    --error-logfile /var/log/jobcare/gunicorn_error.log
    --log-level info
    --access-logformat '%%({x-forwarded-for}i)s %%({x-real-ip}i)s %%({x-forwarded-for}i)s %%(l)s %%(u)s %%(t)s "%%(r)s" %%(s)s %%(b)s "%%(f)s" "%%(a)s"'
directory=/home/deploy/jobcare_voice/backend
user=deploy
group=deploy
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stopsignal=TERM
environment=
    DJANGO_SETTINGS_MODULE="config.settings",
    PYTHONPATH="/home/deploy/jobcare_voice/backend",
    PATH="/home/deploy/jobcare_voice/venv/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/jobcare/backend_out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/jobcare/backend_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
redirect_stderr=false

[program:jobcare_celery_worker]
command=/home/deploy/jobcare_voice/venv/bin/celery -A config worker
    --loglevel=info
    --concurrency=4
    --max-tasks-per-child=1000
    --time-limit=1800
    --soft-time-limit=1500
    --queues=default,voice,notifications,payments,email
    --hostname=worker@%%h
    --autoscale=10,2
directory=/home/deploy/jobcare_voice/backend
user=deploy
group=deploy
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stopsignal=TERM
environment=
    DJANGO_SETTINGS_MODULE="config.settings",
    PYTHONPATH="/home/deploy/jobcare_voice/backend",
    PATH="/home/deploy/jobcare_voice/venv/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/jobcare/celery_worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/jobcare/celery_worker.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
redirect_stderr=true

[program:jobcare_celery_beat]
command=/home/deploy/jobcare_voice/venv/bin/celery -A config beat
    --loglevel=info
    --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    --max-interval=300
    --pidfile=/tmp/celery-beat.pid
directory=/home/deploy/jobcare_voice/backend
user=deploy
group=deploy
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stopsignal=TERM
environment=
    DJANGO_SETTINGS_MODULE="config.settings",
    PYTHONPATH="/home/deploy/jobcare_voice/backend",
    PATH="/home/deploy/jobcare_voice/venv/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/jobcare/celery_beat.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/jobcare/celery_beat.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
redirect_stderr=true

[group:jobcare]
programs=jobcare_backend,jobcare_celery_worker,jobcare_celery_beat
priority=999

; ============================================
; Event listeners
; ============================================

[eventlistener:process_state]
command=/usr/bin/supervisor_slack_notifier
events=PROCESS_STATE_STARTING,PROCESS_STATE_RUNNING,PROCESS_STATE_BACKOFF,PROCESS_STATE_STOPPING,PROCESS_STATE_EXITED,PROCESS_STATE_STOPPED,PROCESS_STATE_FATAL
buffer_size=100
