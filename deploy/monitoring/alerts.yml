groups:
  - name: jobcare_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(django_http_responses_total{status=~"5.."}[5m]) / rate(django_http_responses_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High HTTP error rate ({{ $value | humanizePercentage }} > 5%)"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(django_http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High p99 latency ({{ $value }}s > 1s)"
          description: "p99 latency is {{ $value }}s for the last 5 minutes."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Database connections at {{ $value | humanizePercentage }} of max."

      - alert: RedisMemoryHigh
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Redis memory usage > 80%"
          description: "Redis is using {{ $value }}% of available memory."

      - alert: CeleryQueueBacklog
        expr: celery_queue_length > 1000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Celery queue backlog > 1000 tasks"
          description: "Celery queue has {{ $value }} pending tasks for over 10 minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Disk space below 10%"
          description: "Disk is {{ $value }}% full."

      - alert: RateLimitHigh
        expr: rate(django_rate_limit_hits_total[5m]) / rate(django_requests_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Rate limit threshold approaching"
          description: "Rate limit hits at {{ $value | humanizePercentage }} of total requests."

      - alert: CeleryTaskFailure
        expr: rate(celery_tasks_failed_total[10m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High Celery task failure rate"
          description: "{{ $value }} tasks failing per second over 10 minutes."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "CPU usage > 80%"
          description: "CPU usage is at {{ $value }}%."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Memory usage > 85%"
          description: "Memory usage is at {{ $value }}%."
