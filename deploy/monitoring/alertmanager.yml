global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.sendgrid.net:587
  smtp_from: alerts@jobcarevoice.com
  smtp_auth_username: apikey
  smtp_auth_password: SENDGRID_API_KEY
  smtp_require_tls: true
  slack_api_url: https://hooks.slack.com/services/T00/B00/XXXXX

route:
  group_by: ['alertname', 'team', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      repeat_interval: 1h
      routes:
        - match:
            team: backend
          receiver: pagerduty-backend
        - match:
            team: infrastructure
          receiver: pagerduty-infra

    - match:
        severity: warning
      receiver: slack-warning
      repeat_interval: 4h

    - match:
        severity: info
      receiver: slack-info
      repeat_interval: 24h

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']

receivers:
  - name: default
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
    email_configs:
      - to: 'team@jobcarevoice.com'
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: PAGERDUTY_ROUTING_KEY
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        client: 'JobCare Voice Monitoring'

  - name: pagerduty-backend
    pagerduty_configs:
      - routing_key: PAGERDUTY_BACKEND_KEY
        severity: error
        description: '{{ .CommonAnnotations.summary }}'

  - name: pagerduty-infra
    pagerduty_configs:
      - routing_key: PAGERDUTY_INFRA_KEY
        severity: error
        description: '{{ .CommonAnnotations.summary }}'

  - name: slack-warning
    slack_configs:
      - channel: '#alerts-warnings'
        send_resolved: true
        title: '⚠️ {{ .GroupLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        color: warning

  - name: slack-info
    slack_configs:
      - channel: '#alerts-info'
        send_resolved: true
        title: 'ℹ️ {{ .GroupLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        color: good
